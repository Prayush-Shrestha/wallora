services:
  db:
    image: postgres:16-alpine
    container_name: wallora-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: wallora
    ports:
      - "5432:5432"
    volumes:
      - wallora-pgdata:/var/lib/postgresql/data

volumes:
  wallora-pgdata:
